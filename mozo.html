<main class="mx-auto max-w-md px-4 pb-12 pt-5">
  <!-- Ingreso con PIN -->
  <form id="f-pin" class="pop rounded-3xl bg-white p-6 text-center shadow-xl shadow-espresso-900/10 ring-1 ring-black/5 dark:bg-espresso-800 dark:ring-white/10">
    <div class="mx-auto grid size-16 place-items-center rounded-2xl bg-espresso-800/10 text-3xl dark:bg-white/10">🔒</div>
    <h1 class="font-display mt-4 text-2xl font-extrabold">Ingresá el PIN del local</h1>
    <p class="mt-1 text-sm text-stone-500 dark:text-stone-300">Lo tiene el encargado. Queda guardado en este celular.</p>
    <label for="pin" class="sr-only">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••••"
      class="mt-5 w-full rounded-2xl border-2 border-stone-200 bg-crema-50 py-4 text-center font-mono text-3xl font-bold tracking-[.4em] outline-none focus:border-espresso-700 dark:border-white/10 dark:bg-espresso-900 dark:focus:border-caramel-400">
    <p id="pin-err" class="mt-3 hidden text-sm font-semibold text-cherry-500"></p>
    <button type="submit" class="mt-4 w-full rounded-2xl bg-espresso-800 py-4 text-lg font-bold text-white transition active:scale-[.98] dark:bg-caramel-400 dark:text-espresso-950">Entrar</button>
  </form>

  <!-- Panel con pestañas deslizables -->
  <div id="panel" class="hidden"><div id="panel-swiper" class="swiper !overflow-visible">
    <div class="swiper-wrapper">
      <!-- Validar -->
      <section class="swiper-slide !h-auto">
        <form id="f-cod" class="rounded-3xl bg-white p-5 shadow-xl shadow-espresso-900/10 ring-1 ring-black/5 dark:bg-espresso-800 dark:ring-white/10">
          <label for="cod" class="text-sm font-bold uppercase tracking-wider text-stone-500 dark:text-stone-300">Código del cliente</label>
          <input id="cod" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="8" placeholder="ABC123"
            class="mt-2 w-full rounded-2xl border-2 border-stone-200 bg-crema-50 py-4 text-center font-mono text-4xl font-extrabold uppercase tracking-[.22em] outline-none placeholder:text-stone-300 focus:border-espresso-700 dark:border-white/10 dark:bg-espresso-900 dark:placeholder:text-white/20 dark:focus:border-caramel-400">
          <div id="dots" class="mt-3 flex justify-center gap-1.5"></div>
          <button id="b-ver" type="submit" disabled class="mt-4 w-full rounded-2xl bg-espresso-800 py-4 text-lg font-bold text-white transition active:scale-[.98] disabled:opacity-40 dark:bg-caramel-400 dark:text-espresso-950">Verificar código</button>
          <p id="cod-err" class="mt-3 hidden rounded-xl bg-cherry-500/10 px-3 py-2 text-center text-sm font-semibold text-cherry-500"></p>

      </section>

          <div class="rounded-3xl bg-caramel-400 p-4 text-espresso-950"><p class="text-xs font-semibold uppercase tracking-wider text-espresso-950/60">Último</p><p id="ultimo" class="font-display mt-1 text-4xl font-extrabold tabular-nums">—</p></div>

          <div class="mt-3 grid grid-cols-7 gap-1 text-center text-[11px] font-extrabold uppercase text-stone-400">
            <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
          </div>
          <div id="cal" class="mt-1 grid grid-cols-7 gap-1" role="grid" aria-label="Canjes por día"></div>
          <div id="cal-dia" class="mt-4 border-t border-stone-100 pt-4 dark:border-white/10"></div>
        </div>

        <div class="mt-4 rounded-3xl bg-white p-2 shadow-sm ring-1 ring-black/5 dark:bg-espresso-800 dark:ring-white/10">
          <div class="flex items-center justify-between px-3 pb-1 pt-2">
            <h2 class="font-display text-lg font-bold">Canjes recientes</h2>
            <button id="refrescar" type="button" class="rounded-lg px-2 py-1 text-sm font-semibold text-stone-500 dark:text-stone-300">↻ Actualizar</button>
          </div>
          <ul id="hist" class="divide-y divide-stone-100 dark:divide-white/10"></ul>
        </div>
      </section>
    </div>
  </div></div>
</main>

<script>
/* ====== CONFIGURACIÓN ====== */
const NOMBRE_LOCAL = "MLCalentitas";
const SUPABASE_URL = "https://ulkcugdtqxuxjmsyqomy.supabase.co";
const SUPABASE_KEY = "sb_publishable_8tZa-AWxSmLJo729GPYmlA_tdgOTF1n";
/* =========================== */

const H = {apikey: SUPABASE_KEY, 'Content-Type': 'application/json'};
async function rpc(fn, args){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {method:'POST', headers:H, body:JSON.stringify(args)});
  const d = await r.json().catch(() => null);
  if(!r.ok) throw new Error((d && d.message) || 'Sin conexión. Probá de nuevo.');
  return d;
}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hora = iso => new Date(iso).toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', hour12:false});
const fecha = iso => new Date(iso).toLocaleString('es-AR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', hour12:false});
const limpio = s => s.toUpperCase().replace(/[^A-Z0-9]/g, '');
const store = {
  get(){ try{ return localStorage.getItem('cuponera_pin') || '' }catch(e){ return '' } },
  set(v){ try{ v ? localStorage.setItem('cuponera_pin', v) : localStorage.removeItem('cuponera_pin') }catch(e){} }
};
let PIN = store.get(), actual = null, swiper = null;

function show(el, on, disp = 'block'){ el.classList.toggle('hidden', !on); if(disp !== 'block') el.classList.toggle(disp, on); }

function mostrar(err){
  const dentro = !!PIN;
  show($('f-pin'), !dentro); show($('panel'), dentro); show($('salir'), dentro); show($('tabs'), dentro, 'grid');
  if(err){ $('pin-err').textContent = err; show($('pin-err'), true); }
  if(dentro){
    if(!swiper){
      swiper = new Swiper('#panel-swiper', {autoHeight: true, spaceBetween: 24, resistanceRatio: .5});
      swiper.on('slideChange', () => { marcarTab(swiper.activeIndex); if(swiper.activeIndex === 1){ historial(); cargarMes().then(() => verDia(cal.sel)); } });
    }
    swiper.update(); historial(); $('cod').focus();
  } else { $('pin').value = ''; $('pin').focus(); }
}
function marcarTab(i){ document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(+t.dataset.tab === i))); }
document.querySelectorAll('.tab').forEach(t => t.onclick = () => swiper && swiper.slideTo(+t.dataset.tab));

$('f-pin').addEventListener('submit', async e => {
  e.preventDefault();
  const p = $('pin').value.trim(); if(!p) return;
  show($('pin-err'), false);
  try{
    if(await rpc('mozo_login', {p_pin: p})){ PIN = p; store.set(p); mostrar(); }
    else { $('pin-err').textContent = 'PIN incorrecto. Probá de nuevo.'; show($('pin-err'), true); $('pin').select(); }
  }catch(err){ $('pin-err').textContent = err.message; show($('pin-err'), true); }
});
$('salir').onclick = () => { PIN = ''; store.set(''); reset(); mostrar(); };
function sinPin(r){ if(r && r.error === 'PIN incorrecto'){ PIN = ''; store.set(''); mostrar('El PIN cambió. Ingresalo de nuevo.'); return true; } return false; }

// Indicador de 6 caracteres
function dots(n){ $('dots').innerHTML = Array.from({length: 6}, (_, i) => `<span class="h-1.5 w-6 rounded-full transition ${i < n ? 'bg-espresso-700 dark:bg-caramel-400' : 'bg-stone-200 dark:bg-white/10'}"></span>`).join(''); }
dots(0);
$('cod').addEventListener('input', () => {
  const v = limpio($('cod').value); $('cod').value = v; dots(Math.min(v.length, 6));
  $('b-ver').disabled = v.length < 6; show($('cod-err'), false);
});

$('f-cod').addEventListener('submit', async e => {
  e.preventDefault();
  const c = limpio($('cod').value); if(c.length < 6) return;
  $('b-ver').disabled = true; $('b-ver').textContent = 'Verificando…';
  try{
    const r = await rpc('verificar_codigo', {p_codigo: c, p_pin: PIN});
    if(sinPin(r)) return;
    if(!r.ok){ show($('res'), false); $('cod-err').textContent = r.error === 'Código inexistente' ? `No existe el código ${c}. Revisalo con el cliente.` : r.error; show($('cod-err'), true); }
    else { actual = r; pintar(r); }
  }catch(err){ $('cod-err').textContent = err.message; show($('cod-err'), true); }
  finally{ $('b-ver').textContent = 'Verificar código'; $('b-ver').disabled = limpio($('cod').value).length < 6; swiper && swiper.updateAutoHeight(200); }
});

function pintar(r, recien){
  const usado = r.estado === 'usado';
  const est = recien
    ? {wrap:'bg-emerald-600 text-white', chip:'bg-white/20', icon:'✓', txt:'Canje confirmado', sub:'Aplicá el descuento en la cuenta'}
    : usado
    ? {wrap:'bg-cherry-500 text-white', chip:'bg-white/20', icon:'✕', txt:'Código ya usado', sub:`Se canjeó el ${fecha(r.usado_en)}`}
    : (r.en_horario === false || r.vencido)
    ? {wrap:'bg-amber-50 text-amber-950 ring-2 ring-amber-400 dark:bg-amber-400/10 dark:text-amber-100', chip:'bg-amber-200 text-amber-900 dark:bg-amber-400/20 dark:text-amber-200', icon:'⏰', txt: r.vencido ? 'Cupón vencido' : 'Fuera de horario', sub: r.vencido ? 'Este cupón ya no se puede canjear.' : `Solo se canjea: ${r.horario}. Pedile al cliente que vuelva en ese horario.`, bloqueado:true}
    : {wrap:'bg-white text-stone-900 ring-2 ring-espresso-700 dark:bg-espresso-800 dark:text-white dark:ring-caramel-400', chip:'bg-emerald-100 text-emerald-800 dark:bg-emerald-400/15 dark:text-emerald-300', icon:'●', txt:'Válido · sin usar', sub:'Revisá las condiciones y confirmá'};
  $('res').innerHTML = `<div class="pop overflow-hidden rounded-3xl ${est.wrap} shadow-xl">
    <div class="p-5">
      <div class="flex items-center justify-between gap-2">
        <span class="inline-flex items-center gap-1.5 rounded-full ${est.chip} px-3 py-1 text-sm font-extrabold">${est.icon} ${est.txt}</span>
        <span class="font-mono text-sm font-bold tracking-wider opacity-70">${esc(r.codigo)}</span>
      </div>
      <p class="mt-1 text-sm opacity-75">${esc(est.sub)}</p>
      <div class="mt-4 flex items-center gap-4">
        <span class="grid size-16 shrink-0 place-items-center rounded-2xl bg-black/5 text-4xl dark:bg-white/10">${esc(r.icono || '☕')}</span>
        <div class="min-w-0"><p class="font-display text-3xl font-extrabold leading-none">${esc(r.etiqueta)}</p><p class="mt-1 font-bold leading-snug">${esc(r.titulo)}</p></div>
      </div>
      ${r.horario && !est.bloqueado ? `<p class="mt-4 flex items-center gap-2 rounded-2xl bg-black/5 p-3 text-sm dark:bg-white/10"><b>Horario:</b> ${esc(r.horario)}</p>` : ''}
      ${r.condiciones ? `<p class="mt-2 rounded-2xl bg-black/5 p-3 text-sm dark:bg-white/10"><b>Condiciones:</b> ${esc(r.condiciones)}</p>` : ''}
      <p class="mt-3 truncate text-sm opacity-70">Cliente: ${esc(r.email)}</p>
    </div>
    <div class="grid gap-2 p-5 pt-0">
      ${est.bloqueado
        ? `<button id="b-otro" type="button" class="w-full rounded-2xl bg-amber-900 py-4 text-lg font-extrabold text-white transition active:scale-[.98] dark:bg-amber-300 dark:text-amber-950">Validar otro código</button>`
        : !usado
        ? `<button id="b-canje" type="button" class="w-full rounded-2xl bg-emerald-600 py-4 text-lg font-extrabold text-white shadow-lg shadow-emerald-600/30 transition active:scale-[.98]">Confirmar canje</button>
           <button id="b-cancel" type="button" class="w-full rounded-2xl py-3 font-bold opacity-70">Cancelar</button>`
        : `<button id="b-otro" type="button" class="w-full rounded-2xl bg-white py-4 text-lg font-extrabold text-stone-900 transition active:scale-[.98]">Validar otro código</button>`}
    </div></div>`;
  show($('res'), true);
  swiper && swiper.updateAutoHeight(200);
  $('res').scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

$('res').addEventListener('click', async e => {
  const id = e.target.closest('button')?.id;
  if(id === 'b-cancel' || id === 'b-otro'){ reset(); return; }
  if(id !== 'b-canje') return;
  const b = $('b-canje'); b.disabled = true; b.textContent = 'Confirmando…';
  try{
    const r = await rpc('canjear_codigo', {p_codigo: actual.codigo, p_pin: PIN});
    if(sinPin(r)) return;
    if(r.recien_canjeado){ pintar({...actual, ...r}, true); historial(); if(cal) cargarMes(); try{ navigator.vibrate && navigator.vibrate(80) }catch(_){} }
    else if(r.fuera_de_horario){ pintar({...actual, en_horario: false}); }
    else pintar({...actual, ...r});
  }catch(err){ b.disabled = false; b.textContent = 'Confirmar canje'; $('cod-err').textContent = err.message; show($('cod-err'), true); }
});
function reset(){ show($('res'), false); $('cod').value = ''; dots(0); $('b-ver').disabled = true; actual = null; show($('cod-err'), false); swiper && swiper.updateAutoHeight(200); $('cod').focus(); }

async function historial(){
  try{
    const r = await rpc('historial_canjes', {p_pin: PIN});
    if(sinPin(r)) return;
    $('hoy').textContent = r.hoy; $('hoy-badge').textContent = r.hoy;
    $('ultimo').textContent = r.items.length ? hora(r.items[0].usado_en) : '—';
    $('hist').innerHTML = r.items.length ? r.items.map(i => `
      <li class="flex items-center gap-3 px-3 py-3">
        <span class="grid size-10 shrink-0 place-items-center rounded-xl bg-emerald-100 text-emerald-700 dark:bg-emerald-400/15 dark:text-emerald-300">✓</span>
        <div class="min-w-0 flex-1"><p class="truncate font-bold">${esc(i.etiqueta)} · ${esc(i.titulo)}</p>
        <p class="truncate text-xs text-stone-500 dark:text-stone-400"><span class="font-mono font-bold">${esc(i.codigo)}</span> · ${esc(i.email)}</p></div>
        <span class="text-sm font-semibold tabular-nums text-stone-500 dark:text-stone-400">${hora(i.usado_en)}</span>
      </li>`).join('')
      : `<li class="px-3 py-8 text-center text-sm text-stone-500 dark:text-stone-400">Todavía no hay canjes. Cuando confirmes uno, aparece acá.</li>`;
  }catch(e){ $('hist').innerHTML = `<li class="px-3 py-6 text-center text-sm text-cherry-500">${esc(e.message)}</li>`; }
  swiper && swiper.updateAutoHeight(200);
}
$('refrescar').onclick = () => { historial(); cargarMes(); };

// ---------- Calendario de canjes ----------
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS_LARGOS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const hoyAR = () => new Date().toLocaleDateString('en-CA', {timeZone: 'America/Argentina/Buenos_Aires'});
const pad = n => String(n).padStart(2, '0');
let cal = null;
function iniciarCal(){ if(cal) return; const [y, m, d] = hoyAR().split('-').map(Number); cal = {anio: y, mes: m, sel: hoyAR(), dias: {}}; }
async function cargarMes(){
  iniciarCal();
  $('cal-titulo').textContent = `${MESES[cal.mes - 1]} ${cal.anio}`;
  try{
    const r = await rpc('canjes_mes', {p_pin: PIN, p_anio: cal.anio, p_mes: cal.mes});
    if(sinPin(r)) return;
    cal.dias = r.dias || {};
    $('cal-total').innerHTML = `<b class="tabular-nums text-stone-800 dark:text-stone-100">${r.total}</b> ${r.total === 1 ? 'canje' : 'canjes'} en el mes`;
    pintarMes();
  }catch(e){ $('cal-total').textContent = e.message; }
}
function pintarMes(){
  const hoy = hoyAR(), primero = new Date(cal.anio, cal.mes - 1, 1), diasMes = new Date(cal.anio, cal.mes, 0).getDate();
  const offset = (primero.getDay() + 6) % 7;   // lunes primero
  const max = Math.max(1, ...Object.values(cal.dias));
  let html = '<span></span>'.repeat(offset);
  for(let d = 1; d <= diasMes; d++){
    const f = `${cal.anio}-${pad(cal.mes)}-${pad(d)}`, n = cal.dias[d] || 0, futuro = f > hoy, sel = f === cal.sel, esHoy = f === hoy;
    const nivel = n ? Math.max(1, Math.ceil(n / max * 3)) : 0;
    const fondo = sel ? 'bg-mlc-yellow text-mlc-maroon ring-2 ring-mlc-maroon dark:ring-mlc-yellow'
      : n ? ['', 'bg-red-50 dark:bg-red-400/10', 'bg-red-100 dark:bg-red-400/20', 'bg-red-200 dark:bg-red-400/30'][nivel]
      : 'bg-stone-50 dark:bg-white/5';
    html += `<button type="button" data-fecha="${f}" ${futuro ? 'disabled' : ''} aria-pressed="${sel}"
      aria-label="${d} de ${MESES[cal.mes - 1]}: ${n} ${n === 1 ? 'canje' : 'canjes'}${esHoy ? ' (hoy)' : ''}"
      class="relative flex aspect-square flex-col items-center justify-center rounded-xl text-sm font-bold transition active:scale-95 disabled:opacity-30 ${fondo} ${esHoy && !sel ? 'ring-2 ring-espresso-700 dark:ring-caramel-400' : ''}">
      <span class="${n || sel ? '' : 'text-stone-500 dark:text-stone-400'}">${d}</span>
      ${n ? `<span class="mt-0.5 min-w-5 rounded-full ${sel ? 'bg-mlc-maroon text-mlc-yellow' : 'bg-mlc-maroon text-white'} px-1 text-[10px] font-extrabold leading-4 tabular-nums">${n}</span>` : '<span class="mt-0.5 h-4"></span>'}
    </button>`;
  }
  $('cal').innerHTML = html;
  const [hy, hm] = hoy.split('-').map(Number);
  $('cal-next').disabled = cal.anio > hy || (cal.anio === hy && cal.mes >= hm);
  swiper && swiper.updateAutoHeight(200);
}
async function verDia(f){
  cal.sel = f; pintarMes();
  const [y, m, d] = f.split('-').map(Number), dow = new Date(y, m - 1, d).getDay();
  const titulo = `${f === hoyAR() ? 'Hoy, ' : ''}${DIAS_LARGOS[dow]} ${d} de ${MESES[m - 1]}`;
  $('cal-dia').innerHTML = `<p class="text-center text-sm text-stone-500">Cargando…</p>`;
  try{
    const r = await rpc('canjes_dia', {p_pin: PIN, p_fecha: f});
    if(sinPin(r)) return;
    const n = r.items.length;
    $('cal-dia').innerHTML = `
      <div class="flex items-baseline justify-between gap-2">
        <h3 class="font-display text-base font-extrabold first-letter:uppercase">${titulo}</h3>
        <p class="shrink-0 font-display text-2xl font-extrabold tabular-nums">${n} <span class="font-sans text-sm font-semibold text-stone-500">${n === 1 ? 'canje' : 'canjes'}</span></p>
      </div>
      ${n ? `<div class="mt-2 flex flex-wrap gap-1.5">${r.por_cupon.map(x => `<span class="rounded-full bg-stone-100 px-2.5 py-1 text-xs font-bold dark:bg-white/10">${esc(x.etiqueta)} · ${esc(x.titulo)} <b class="text-mlc-maroon dark:text-mlc-yellow">×${x.n}</b></span>`).join('')}</div>
        <ul class="mt-3 divide-y divide-stone-100 dark:divide-white/10">${r.items.map(i => `
          <li class="flex items-center gap-3 py-2.5">
            <span class="w-12 shrink-0 font-mono text-sm font-bold tabular-nums text-stone-500 dark:text-stone-400">${hora(i.usado_en)}</span>
            <div class="min-w-0 flex-1"><p class="truncate text-sm font-bold">${esc(i.icono || '')} ${esc(i.titulo)}</p>
            <p class="truncate text-xs text-stone-500 dark:text-stone-400"><span class="font-mono font-bold">${esc(i.codigo)}</span> · ${esc(i.email)}</p></div>
          </li>`).join('')}</ul>`
      : `<p class="mt-2 text-sm text-stone-500 dark:text-stone-400">Ese día no se canjeó ningún cupón.</p>`}`;
  }catch(e){ $('cal-dia').innerHTML = `<p class="text-sm font-semibold text-cherry-500">${esc(e.message)}</p>`; }
  swiper && swiper.updateAutoHeight(200);
}
$('cal').addEventListener('click', e => { const b = e.target.closest('[data-fecha]'); if(b && !b.disabled) verDia(b.dataset.fecha); });
function moverMes(k){
  let m = cal.mes + k, y = cal.anio; if(m < 1){ m = 12; y--; } if(m > 12){ m = 1; y++; }
  cal.anio = y; cal.mes = m;
  const hoy = hoyAR(); cal.sel = hoy.startsWith(`${y}-${pad(m)}`) ? hoy : `${y}-${pad(m)}-01`;
  cargarMes().then(() => verDia(cal.sel));
}
$('cal-prev').onclick = () => moverMes(-1);
$('cal-next').onclick = () => moverMes(1);

mostrar();
</script>
</body>
</html>
