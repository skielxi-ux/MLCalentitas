<script>
/* ====== CONFIGURACIÓN ====== */
const NOMBRE_LOCAL = "MLCalentitas";
const SUPABASE_URL = "https://ulkcugdtqxuxjmsyqomy.supabase.co";
const SUPABASE_KEY = "sb_publishable_8tZa-AWxSmLJo729GPYmlA_tdgOTF1n";
/* =========================== */

const H = {apikey: SUPABASE_KEY, 'Content-Type': 'application/json'};
async function rpc(fn, args){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {method:'POST', headers:H, body:JSON.stringify(args)});
  const d = await r.json().catch(() => null);
  if(!r.ok) throw new Error((d && d.message) || 'Sin conexión. Probá de nuevo.');
  return d;
}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hora = iso => new Date(iso).toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', hour12:false});
const fecha = iso => new Date(iso).toLocaleString('es-AR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', hour12:false});
const limpio = s => s.toUpperCase().replace(/[^A-Z0-9]/g, '');
const store = {
  get(){ try{ return localStorage.getItem('cuponera_pin') || '' }catch(e){ return '' } },
  set(v){ try{ v ? localStorage.setItem('cuponera_pin', v) : localStorage.removeItem('cuponera_pin') }catch(e){} }
};
let PIN = store.get(), actual = null, swiper = null;

function show(el, on, disp = 'block'){ el.classList.toggle('hidden', !on); if(disp !== 'block') el.classList.toggle(disp, on); }

function mostrar(err){
  const dentro = !!PIN;
  show($('f-pin'), !dentro); show($('panel'), dentro); show($('salir'), dentro); show($('tabs'), dentro, 'grid');
  if(err){ $('pin-err').textContent = err; show($('pin-err'), true); }
  if(dentro){
    if(!swiper){
      swiper = new Swiper('#panel-swiper', {autoHeight: true, spaceBetween: 24, resistanceRatio: .5});
      swiper.on('slideChange', () => { marcarTab(swiper.activeIndex); if(swiper.activeIndex === 1) historial(); });
    }
    swiper.update(); historial(); $('cod').focus();
  } else { $('pin').value = ''; $('pin').focus(); }
}
function marcarTab(i){ document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(+t.dataset.tab === i))); }
document.querySelectorAll('.tab').forEach(t => t.onclick = () => swiper && swiper.slideTo(+t.dataset.tab));

$('f-pin').addEventListener('submit', async e => {
  e.preventDefault();
  const p = $('pin').value.trim(); if(!p) return;
  show($('pin-err'), false);
  try{
    if(await rpc('mozo_login', {p_pin: p})){ PIN = p; store.set(p); mostrar(); }
    else { $('pin-err').textContent = 'PIN incorrecto. Probá de nuevo.'; show($('pin-err'), true); $('pin').select(); }
  }catch(err){ $('pin-err').textContent = err.message; show($('pin-err'), true); }
});
$('salir').onclick = () => { PIN = ''; store.set(''); reset(); mostrar(); };
function sinPin(r){ if(r && r.error === 'PIN incorrecto'){ PIN = ''; store.set(''); mostrar('El PIN cambió. Ingresalo de nuevo.'); return true; } return false; }

// Indicador de 6 caracteres
function dots(n){ $('dots').innerHTML = Array.from({length: 6}, (_, i) => `<span class="h-1.5 w-6 rounded-full transition ${i < n ? 'bg-espresso-700 dark:bg-caramel-400' : 'bg-stone-200 dark:bg-white/10'}"></span>`).join(''); }
dots(0);
$('cod').addEventListener('input', () => {
  const v = limpio($('cod').value); $('cod').value = v; dots(Math.min(v.length, 6));
  $('b-ver').disabled = v.length < 6; show($('cod-err'), false);
});

$('f-cod').addEventListener('submit', async e => {
  e.preventDefault();
  const c = limpio($('cod').value); if(c.length < 6) return;
  $('b-ver').disabled = true; $('b-ver').textContent = 'Verificando…';
  try{
    const r = await rpc('verificar_codigo', {p_codigo: c, p_pin: PIN});
    if(sinPin(r)) return;
    if(!r.ok){ show($('res'), false); $('cod-err').textContent = r.error === 'Código inexistente' ? `No existe el código ${c}. Revisalo con el cliente.` : r.error; show($('cod-err'), true); }
    else { actual = r; pintar(r); }
  }catch(err){ $('cod-err').textContent = err.message; show($('cod-err'), true); }
  finally{ $('b-ver').textContent = 'Verificar código'; $('b-ver').disabled = limpio($('cod').value).length < 6; swiper && swiper.updateAutoHeight(200); }
});

function pintar(r, recien){
  const usado = r.estado === 'usado';
  const est = recien
    ? {wrap:'bg-emerald-600 text-white', chip:'bg-white/20', icon:'✓', txt:'Canje confirmado', sub:'Aplicá el descuento en la cuenta'}
    : usado
    ? {wrap:'bg-cherry-500 text-white', chip:'bg-white/20', icon:'✕', txt:'Código ya usado', sub:`Se canjeó el ${fecha(r.usado_en)}`}
    : (r.en_horario === false || r.vencido)
    ? {wrap:'bg-amber-50 text-amber-950 ring-2 ring-amber-400 dark:bg-amber-400/10 dark:text-amber-100', chip:'bg-amber-200 text-amber-900 dark:bg-amber-400/20 dark:text-amber-200', icon:'⏰', txt: r.vencido ? 'Cupón vencido' : 'Fuera de horario', sub: r.vencido ? 'Este cupón ya no se puede canjear.' : `Solo se canjea: ${r.horario}. Pedile al cliente que vuelva en ese horario.`, bloqueado:true}
    : {wrap:'bg-white text-stone-900 ring-2 ring-espresso-700 dark:bg-espresso-800 dark:text-white dark:ring-caramel-400', chip:'bg-emerald-100 text-emerald-800 dark:bg-emerald-400/15 dark:text-emerald-300', icon:'●', txt:'Válido · sin usar', sub:'Revisá las condiciones y confirmá'};
  $('res').innerHTML = `<div class="pop overflow-hidden rounded-3xl ${est.wrap} shadow-xl">
    <div class="p-5">
      <div class="flex items-center justify-between gap-2">
        <span class="inline-flex items-center gap-1.5 rounded-full ${est.chip} px-3 py-1 text-sm font-extrabold">${est.icon} ${est.txt}</span>
        <span class="font-mono text-sm font-bold tracking-wider opacity-70">${esc(r.codigo)}</span>
      </div>
      <p class="mt-1 text-sm opacity-75">${esc(est.sub)}</p>
      <div class="mt-4 flex items-center gap-4">
        <span class="grid size-16 shrink-0 place-items-center rounded-2xl bg-black/5 text-4xl dark:bg-white/10">${esc(r.icono || '☕')}</span>
        <div class="min-w-0"><p class="font-display text-3xl font-extrabold leading-none">${esc(r.etiqueta)}</p><p class="mt-1 font-bold leading-snug">${esc(r.titulo)}</p></div>
      </div>
      ${r.horario && !est.bloqueado ? `<p class="mt-4 flex items-center gap-2 rounded-2xl bg-black/5 p-3 text-sm dark:bg-white/10"><b>Horario:</b> ${esc(r.horario)}</p>` : ''}
      ${r.condiciones ? `<p class="mt-2 rounded-2xl bg-black/5 p-3 text-sm dark:bg-white/10"><b>Condiciones:</b> ${esc(r.condiciones)}</p>` : ''}
      <p class="mt-3 truncate text-sm opacity-70">Cliente: ${esc(r.email)}</p>
    </div>
    <div class="grid gap-2 p-5 pt-0">
      ${est.bloqueado
        ? `<button id="b-otro" type="button" class="w-full rounded-2xl bg-amber-900 py-4 text-lg font-extrabold text-white transition active:scale-[.98] dark:bg-amber-300 dark:text-amber-950">Validar otro código</button>`
        : !usado
        ? `<button id="b-canje" type="button" class="w-full rounded-2xl bg-emerald-600 py-4 text-lg font-extrabold text-white shadow-lg shadow-emerald-600/30 transition active:scale-[.98]">Confirmar canje</button>
           <button id="b-cancel" type="button" class="w-full rounded-2xl py-3 font-bold opacity-70">Cancelar</button>`
        : `<button id="b-otro" type="button" class="w-full rounded-2xl bg-white py-4 text-lg font-extrabold text-stone-900 transition active:scale-[.98]">Validar otro código</button>`}
    </div></div>`;
  show($('res'), true);
  swiper && swiper.updateAutoHeight(200);
  $('res').scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

$('res').addEventListener('click', async e => {
  const id = e.target.closest('button')?.id;
  if(id === 'b-cancel' || id === 'b-otro'){ reset(); return; }
  if(id !== 'b-canje') return;
  const b = $('b-canje'); b.disabled = true; b.textContent = 'Confirmando…';
  try{
    const r = await rpc('canjear_codigo', {p_codigo: actual.codigo, p_pin: PIN});
    if(sinPin(r)) return;
    if(r.recien_canjeado){ pintar({...actual, ...r}, true); historial(); try{ navigator.vibrate && navigator.vibrate(80) }catch(_){} }
    else if(r.fuera_de_horario){ pintar({...actual, en_horario: false}); }
    else pintar({...actual, ...r});
  }catch(err){ b.disabled = false; b.textContent = 'Confirmar canje'; $('cod-err').textContent = err.message; show($('cod-err'), true); }
});
function reset(){ show($('res'), false); $('cod').value = ''; dots(0); $('b-ver').disabled = true; actual = null; show($('cod-err'), false); swiper && swiper.updateAutoHeight(200); $('cod').focus(); }

async function historial(){
  try{
    const r = await rpc('historial_canjes', {p_pin: PIN});
    if(sinPin(r)) return;
    $('hoy').textContent = r.hoy; $('hoy-badge').textContent = r.hoy;
    $('ultimo').textContent = r.items.length ? hora(r.items[0].usado_en) : '—';
    $('hist').innerHTML = r.items.length ? r.items.map(i => `
      <li class="flex items-center gap-3 px-3 py-3">
        <span class="grid size-10 shrink-0 place-items-center rounded-xl bg-emerald-100 text-emerald-700 dark:bg-emerald-400/15 dark:text-emerald-300">✓</span>
        <div class="min-w-0 flex-1"><p class="truncate font-bold">${esc(i.etiqueta)} · ${esc(i.titulo)}</p>
        <p class="truncate text-xs text-stone-500 dark:text-stone-400"><span class="font-mono font-bold">${esc(i.codigo)}</span> · ${esc(i.email)}</p></div>
        <span class="text-sm font-semibold tabular-nums text-stone-500 dark:text-stone-400">${hora(i.usado_en)}</span>
      </li>`).join('')
      : `<li class="px-3 py-8 text-center text-sm text-stone-500 dark:text-stone-400">Todavía no hay canjes. Cuando confirmes uno, aparece acá.</li>`;
  }catch(e){ $('hist').innerHTML = `<li class="px-3 py-6 text-center text-sm text-cherry-500">${esc(e.message)}</li>`; }
  swiper && swiper.updateAutoHeight(200);
}
$('refrescar').onclick = historial;

mostrar();
</script>
</body>
</html>
